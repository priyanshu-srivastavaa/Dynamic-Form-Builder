<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Forgot Password - Formify</title>

    <link
        rel="stylesheet"
        href="style.css"
    >
</head>

<body class="dark formify-signup-body">

<div class="signup-page">

    <header class="signup-navbar">

        <a
            href="login.html"
            class="signup-navbar-brand"
        >
            <span class="formify-logo">
                <span></span>
                <span></span>
            </span>

            <strong>Formify</strong>
        </a>

    </header>


    <main class="signup-main">

        <section class="signup-card login-card">

            <div class="signup-card-brand">

                <span class="formify-logo">
                    <span></span>
                    <span></span>
                </span>

                <strong>Formify</strong>

            </div>


            <h1>
                Forgot password?
            </h1>


            <p class="signup-subtitle">
                Enter your email and we'll generate a secure reset link.
            </p>


            <form id="forgotPasswordForm">

                <div class="signup-field">

                    <label for="forgotEmail">
                        Email
                    </label>


                    <div class="signup-input-wrap">

                        <span class="signup-input-icon">
                            ✉
                        </span>


                        <input
                            type="email"
                            id="forgotEmail"
                            placeholder="you@company.com"
                            required
                        >

                    </div>

                </div>


                <p
                    id="forgotMessage"
                    class="signup-message"
                ></p>


                <button
                    type="submit"
                    class="signup-create-btn"
                >
                    <span>
                        Send reset link
                    </span>
                </button>

            </form>


            <p class="signup-login-link">

                Remember your password?

                <a href="login.html">
                    Back to sign in
                </a>

            </p>

        </section>

    </main>

</div>


<script src="js/forgot-password.js"></script>

</body>

</html>
