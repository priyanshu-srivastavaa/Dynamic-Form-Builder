<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Reset Password - Formify</title>

    <link
        rel="stylesheet"
        href="style.css"
    >
</head>

<body class="dark formify-signup-body">

<div class="signup-page">

    <header class="signup-navbar">

        <a
            href="login.html"
            class="signup-navbar-brand"
        >
            <span class="formify-logo">
                <span></span>
                <span></span>
            </span>

            <strong>Formify</strong>
        </a>

    </header>


    <main class="signup-main">

        <section class="signup-card login-card">

            <div class="signup-card-brand">

                <span class="formify-logo">
                    <span></span>
                    <span></span>
                </span>

                <strong>Formify</strong>

            </div>


            <h1>
                Reset password
            </h1>


            <p class="signup-subtitle">
                Create a new secure password for your account.
            </p>


            <form id="resetPasswordForm">

                <!-- NEW PASSWORD -->

                <div class="signup-field">

                    <label for="newPassword">
                        New Password
                    </label>

                    <div class="signup-input-wrap">

                        <span class="signup-input-icon">
                            🔒
                        </span>

                        <input
                            type="password"
                            id="newPassword"
                            placeholder="Enter new password"
                            required
                        >

                        <button
                            type="button"
                            class="signup-eye-btn"
                            id="toggleNewPassword"
                        >
                            👁
                        </button>

                    </div>

                </div>


                <!-- CONFIRM PASSWORD -->

                <div class="signup-field">

                    <label for="confirmNewPassword">
                        Confirm Password
                    </label>

                    <div class="signup-input-wrap">

                        <span class="signup-input-icon">
                            🔒
                        </span>

                        <input
                            type="password"
                            id="confirmNewPassword"
                            placeholder="Confirm new password"
                            required
                        >

                    </div>

                </div>


                <p
                    id="resetMessage"
                    class="signup-message"
                ></p>


                <button
                    type="submit"
                    class="signup-create-btn"
                >
                    <span>
                        Reset Password
                    </span>
                </button>

            </form>


            <p class="signup-login-link">

                Back to

                <a href="login.html">
                    Sign in
                </a>

            </p>

        </section>

    </main>

</div>


<script src="js/reset-password.js"></script>

</body>

</html>
